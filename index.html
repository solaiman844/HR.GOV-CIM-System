<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR.Gov App</title>
  </head>
  <body>
    <div style="position:fixed;left:12px;top:12px;z-index:9999;background:#f7fafc;border:1px solid #e2e8f0;padding:8px 12px;border-radius:6px;color:#1a202c;font-family:Inter,Arial,Helvetica,sans-serif">Static check: HTML loaded</div>
    <script>console.log('index.html inline script executed')</script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      (async () => {
        try {
          await import('/src/index.tsx');
          console.log('dynamic import of /src/index.tsx succeeded');
        } catch (err) {
          console.error('dynamic import of /src/index.tsx failed', err);
        }
      })();
    </script>
